[project]
name = "mvlv-cim"
version = "0.1.0"
description = "Excel to CIM100 builder for four Australian MV distribution networks"
readme = "README.md"
authors = [
    { name = "Michael Liu", email = "104720972+michael-z-liu@users.noreply.github.com" }
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cim100-sdk",
    "openpyxl>=3.1.5",
]

[project.scripts]
mvlv-cim = "mvlv_cim.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
cim100-sdk = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
