# Known errors of the pinned vocabularies, applied by tools/dump_profiles.py. Each must still
# apply (the build fails once upstream fixes it, so the entry can be removed).
[[corrections]]
profile = "SSH"
class = "Equipment"
add_stereotype = "description"
reason = """SSH lists Equipment as concrete without the Description stereotype, although SSH only
describes equipment defined in EQ (the ENTSO-E sample SSH files write <cim:Equipment rdf:about>, and
the CIMTool OWL of the same profile has the stereotype). Without it an SSH Equipment element would
define a second object. Reported as https://github.com/entsoe/CGMES-AP/issues/59."""

