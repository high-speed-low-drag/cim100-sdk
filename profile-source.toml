# Fixed unit multipliers of the CGMES 3.0 datatypes: cims:isFixed of <Datatype>.multiplier and
# <Datatype>.unit in the same ENTSO-E RDFS2020 vocabularies (identical in every profile that uses the
# datatype). The CIMTool OWL files do not carry them and CIM17 leaves most multipliers open. The SDK
# holds SI values; write_cgmes/read_cgmes scale by these multipliers. Money has no fixed unit.
[units]
ActivePower = { multiplier = "M", unit = "W" }
ActivePowerPerCurrentFlow = { multiplier = "M", unit = "WPerA" }
ActivePowerPerFrequency = { multiplier = "M", unit = "WPers" }
AngleDegrees = { multiplier = "none", unit = "deg" }
AngleRadians = { multiplier = "none", unit = "rad" }
ApparentPower = { multiplier = "M", unit = "VA" }
Capacitance = { multiplier = "none", unit = "F" }
Conductance = { multiplier = "none", unit = "S" }
CurrentFlow = { multiplier = "none", unit = "A" }
Frequency = { multiplier = "none", unit = "Hz" }
Inductance = { multiplier = "none", unit = "H" }
Length = { multiplier = "k", unit = "m" }
Money = { multiplier = "none" }
PU = { multiplier = "none", unit = "none" }
PerCent = { multiplier = "none", unit = "none" }
Reactance = { multiplier = "none", unit = "ohm" }
ReactivePower = { multiplier = "M", unit = "VAr" }
RealEnergy = { multiplier = "M", unit = "Wh" }
Resistance = { multiplier = "none", unit = "ohm" }
RotationSpeed = { multiplier = "none", unit = "Hz" }
Seconds = { multiplier = "none", unit = "s" }
Susceptance = { multiplier = "none", unit = "S" }
Temperature = { multiplier = "none", unit = "degC" }
Voltage = { multiplier = "k", unit = "V" }
VoltagePerReactivePower = { multiplier = "none", unit = "VPerVAr" }

